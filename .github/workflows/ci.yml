# Continuous integration for dsh-context-usage-guard.
#
# Mirrors what `pnpm check` does locally — typecheck the host half and the browser
# half against the real dsh types, then run the behavioural suite — so a green
# badge means the same thing here as on a contributor's machine.
#
# The peer dependencies (@deepseek-ai/*) are resolved from the registry, so a
# clean checkout really does install, and the repository carries a lockfile, so
# the install is frozen. `pnpm/action-setup` reads `packageManager` from
# package.json (pnpm@11.20.0, written there by the publish pipeline), which is why
# no version is repeated here.
name: CI

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
  workflow_dispatch:

# Read-only: this workflow never writes to the repository.
permissions:
  contents: read

# One run per branch/PR; a new push cancels the in-progress run instead of queueing it.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  FORCE_COLOR: "1"

jobs:
  check:
    name: typecheck · test
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Version comes from package.json "packageManager" (pnpm@11.20.0).
      - name: Set up pnpm
        uses: pnpm/action-setup@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          # package.json declares "node": ">=22.17.0"; 22 is the current LTS line.
          node-version: "22"
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      # pnpm 11 reads build-script approval from pnpm-workspace.yaml
      # (allowBuilds: esbuild), which is what makes vitest usable.
      - name: Typecheck both halves
        run: pnpm typecheck

      - name: Test
        run: pnpm test
