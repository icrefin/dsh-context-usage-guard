name: Feature request
description: Propose a change or addition to dsh-context-usage-guard
title: "[Feature]: "
labels:
  - enhancement
body:
  - type: markdown
    attributes:
      value: |
        Describe the problem first, then the solution. Requests that explain a real use
        case are far more likely to be implemented. One request per issue, please.

        Note what this plugin deliberately leaves alone: it does not touch the
        `contextPressure` projection, it does not replace or restyle the meter's
        component, and it does not invent a reading. A request that needs one of those
        is a request against the packages that own them, so say which one and why.

  - type: checkboxes
    id: preflight
    attributes:
      label: Preflight checklist
      options:
        - label: I searched existing issues and discussions and did not find a duplicate.
          required: true
        - label: This request is about this project, not about a third-party dependency.
          required: true

  - type: textarea
    id: problem
    attributes:
      label: Problem statement
      description: What are you trying to do, and what blocks you today?
      placeholder: "I want to ... but currently I have to ..."
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution
      description: The change you want, described against what the plugin currently does — a stream rule, a stylesheet rule, or a config field.
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: Other approaches, existing workarounds, or similar features elsewhere.
    validations:
      required: false

  - type: dropdown
    id: area
    attributes:
      label: Area
      description: Which part of the project does this touch?
      options:
        - Host half — the llm/stream guard (`src/guard.ts`, `src/index.ts`)
        - Browser half — the stylesheet rule (`src/client/*`)
        - The rule's selector or the declarations it mirrors
        - Configuration (`enabled`, `logHeldSamples`)
        - Diagnostics or logging
        - Documentation, examples, or the preview harness
        - Packaging, CI, or release
        - Other (describe below)
    validations:
      required: true

  - type: dropdown
    id: breaking
    attributes:
      label: Would this break existing users?
      options:
        - "No — additive change"
        - "Yes — it changes existing behavior or interfaces"
        - Not sure
    validations:
      required: true

  - type: textarea
    id: example
    attributes:
      label: Example usage
      description: Show how the feature would look from a user's point of view.
      render: shell
      placeholder: |
        # e.g. a config field
        - id: dsh-context-usage-guard
          config:
            enabled: true
            logHeldSamples: true
        # ...or the stream shape you want kept or dropped
    validations:
      required: false

  - type: input
    id: version
    attributes:
      label: Version you are running
      placeholder: "v0.2.1 or main"
    validations:
      required: false

  - type: checkboxes
    id: contribution
    attributes:
      label: Willingness to contribute
      options:
        - label: I can open a pull request for this.
          required: false
        - label: I can help with testing or documentation.
          required: false

  - type: checkboxes
    id: conduct
    attributes:
      label: Code of Conduct
      options:
        - label: I agree to follow this project's Code of Conduct.
          required: true
