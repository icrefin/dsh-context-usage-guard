# pnpm 11 reads build-script approval from this file, not from package.json
# (`pnpm.onlyBuiltDependencies` there is warned about and ignored). esbuild's
# postinstall is what makes vitest and tsdown usable, so approve exactly that
# one rather than running every dependency's install script.
allowBuilds:
  esbuild: true
minimumReleaseAgeExclude:
  - '@deepseek-ai/cordis@4.0.5'
  - '@deepseek-ai/cosmokit@1.8.6'
  - '@deepseek-ai/dsh-agent@0.2.1-rc.5'
  - '@deepseek-ai/dsh-attachment@0.2.1-rc.5'
  - '@deepseek-ai/dsh-brand@0.2.1-rc.5'
  - '@deepseek-ai/dsh-client-ui-chat@0.2.1-rc.5'
  - '@deepseek-ai/dsh-client-ui-conversation@0.2.1-rc.5'
  - '@deepseek-ai/dsh-commands@0.2.1-rc.5'
  - '@deepseek-ai/dsh-compaction-image-offload@0.2.1-rc.5'
  - '@deepseek-ai/dsh-compaction@0.2.1-rc.5'
  - '@deepseek-ai/dsh-llm-retry@0.2.1-rc.5'
  - '@deepseek-ai/dsh-llm@0.2.1-rc.5'
  - '@deepseek-ai/dsh-scope@0.2.1-rc.5'
  - '@deepseek-ai/dsh-session-projection@0.2.1-rc.5'
  - '@deepseek-ai/dsh-session@0.2.1-rc.5'
  - '@deepseek-ai/dsh-system-prompt@0.2.1-rc.5'
  - '@deepseek-ai/dsh-timeout@0.2.1-rc.5'
  - '@deepseek-ai/dsh-token-meter@0.2.1-rc.5'
  - '@deepseek-ai/dsh-typert-protocol@0.2.1-rc.5'
  - '@deepseek-ai/dsh-util-crypto@0.2.1-rc.5'
  - '@deepseek-ai/dsh-util-values@0.2.1-rc.5'
  - '@deepseek-ai/schemastery@3.18.5'